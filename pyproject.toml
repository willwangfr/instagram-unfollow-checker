[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-unfollow-checker"
version = "1.0.0"
description = "Analyse your Instagram relationships from your own data export"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "playwright>=1.40",
]

[project.scripts]
ig-unfollow-checker = "ig_unfollow_checker:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: hits real Instagram (needs internet + VPN)"]
